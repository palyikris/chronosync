<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoSync responsive preview</title><style>body{margin:0;background:#e1e5da;font:12px system-ui;color:#34442c}header{min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid #bdc7b0}button{border:1px solid #a5b396;border-radius:5px;background:#f8faef;padding:5px 12px;color:inherit;cursor:pointer}iframe{display:block;margin:20px auto;border:1px solid #a5b396;background:#f4f6ec;box-shadow:0 10px 35px #34442c22;max-width:100%}</style></head>
<body><header><b>ChronoSync / viewport review</b><button data-width="390" data-height="844">Mobile · 390</button><button data-width="768" data-height="1024">Tablet · 768</button><button data-width="1200" data-height="800">Desktop · 1200</button></header><iframe src="/" title="ChronoSync responsive preview" width="390" height="844"></iframe><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.width=button.dataset.width;frame.height=button.dataset.height;}));</script></body></html>
